name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova and Build Clean Project
      run: |
        npm install -g cordova
        cd ..
        cordova create clean_app com.crypto.app "CryptoAnalytics"
        cd clean_app
        rm -rf www/*
        cp -r ../crypto_app/www/* www/
        cordova platform add android
        cordova build android --debug
        mkdir -p ../crypto_app/output
        cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../crypto_app/output/app-debug.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CryptoAnalytics-Dashboard-v2
        path: output/app-debug.apk
