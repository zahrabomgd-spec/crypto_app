<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Pro Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0b0e14; color: #f0f6fc; padding: 12px; font-size: 13px; }
        
        /* الهيدر */
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; margin-bottom: 12px; }
        .logo h1 { color: #58a6ff; font-size: 1.15rem; font-weight: 700; }
        .logo p { color: #8b949e; font-size: 0.7rem; margin-top: 2px; }
        .live-badge { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; background: rgba(46, 160, 67, 0.15); color: #3fb950; padding: 5px 10px; border-radius: 20px; border: 1px solid #2ea043; font-weight: 600; }
        .dot { width: 8px; height: 8px; background: #3fb950; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* البحث والتصنيفات */
        .search-box { width: 100%; padding: 10px 14px; background: #161b22; border: 1px solid #30363d; border-radius: 10px; color: #fff; font-size: 0.85rem; outline: none; margin-bottom: 10px; transition: 0.2s; }
        .search-box:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15); }

        .categories { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
        .cat-btn { background: #161b22; border: 1px solid #30363d; color: #8b949e; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; font-weight: 600; transition: 0.2s; }
        .cat-btn.active { background: #1f6feb; color: #fff; border-color: #388bfd; }

        /* قائمة العملات الأفقيّة */
        .coins-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: thin; }
        .coin-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 10px 12px; min-width: 125px; cursor: pointer; flex-shrink: 0; transition: 0.2s; }
        .coin-card:hover, .coin-card.active { border-color: #58a6ff; background: #1c2128; transform: translateY(-1px); }
        .c-sym { font-weight: 700; font-size: 0.9rem; color: #f0f6fc; }
        .c-price { font-size: 0.82rem; margin: 4px 0; color: #c9d1d9; font-family: monospace; }
        .c-chg { font-size: 0.72rem; font-weight: 700; }

        /* لوحة التحليل والتفاصيل الشاملة */
        .panel { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #21262d; padding-bottom: 8px; }
        .panel-title { font-size: 1rem; font-weight: bold; color: #58a6ff; }
        
        /* شبكة الإحصائيات */
        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
        .metric-box { background: #0d1117; border: 1px solid #21262d; padding: 10px; border-radius: 8px; }
        .m-label { font-size: 0.7rem; color: #8b949e; }
        .m-val { font-size: 0.9rem; font-weight: bold; color: #f0f6fc; margin-top: 3px; font-family: monospace; }

        /* قسم التحويل السريع (حاسبة) */
        .converter-box { background: #0d1117; border: 1px solid #21262d; padding: 10px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
        .converter-box input { width: 45%; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #fff; padding: 6px 10px; font-size: 0.85rem; outline: none; }
        .converter-box span { color: #8b949e; font-size: 0.8rem; font-weight: bold; }

        /* الشارت الفني */
        .chart-box { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 12px; }

        .up { color: #3fb950 !important; }
        .down { color: #f85149 !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h1>⚡ Crypto Pro Terminal</h1>
            <p>منصة التداول وتحليل العملات اللحظية بدقة فائقة</p>
        </div>
        <div class="live-badge">
            <div class="dot"></div> متصل بالسوق
        </div>
    </header>

    <input type="text" id="search-input" class="search-box" placeholder="ابحث بأي عملة (BTC, ETH, PEPE, BTTC, SOL...)" onkeyup="filterCoins()">

    <div class="categories">
        <button class="cat-btn active" onclick="setCategory('all', this)">🔥 الأبرز والأكثر تداولاً</button>
        <button class="cat-btn" onclick="setCategory('memes', this)">🐸 عملات الميم (Memes)</button>
        <button class="cat-btn" onclick="setCategory('gainers', this)">🚀 الأكثر صعوداً</button>
        <button class="cat-btn" onclick="setCategory('losers', this)">🔻 الأكثر هبوطاً</button>
    </div>

    <!-- شريط العملات السريع -->
    <div class="coins-scroll" id="coins-scroll"></div>

    <!-- لوحة التفاصيل والتحليل -->
    <div class="panel">
        <div class="panel-header">
            <span class="panel-title" id="p-title">BTC / USDT</span>
            <span id="p-signal" class="m-val up">اتجاه إيجابي</span>
        </div>

        <div class="metrics-grid">
            <div class="metric-box">
                <div class="m-label">السعر الفوري الدقيق</div>
                <div class="m-val" id="m-price">--</div>
            </div>
            <div class="metric-box">
                <div class="m-label">التغير (24 ساعة)</div>
                <div class="m-val" id="m-change">--</div>
            </div>
            <div class="metric-box">
                <div class="m-label">أعلى / أدنى سعر (24س)</div>
                <div class="m-val" id="m-highlow" style="font-size: 0.75rem;">--</div>
            </div>
            <div class="metric-box">
                <div class="m-label">حجم التداول اليومي</div>
                <div class="m-val" id="m-volume" style="font-size: 0.78rem;">--</div>
            </div>
        </div>

        <!-- حاسبة التحويل الفوري -->
        <div class="converter-box">
            <input type="number" id="qty-input" value="1" min="0" oninput="convertCurrency()" placeholder="الكمية">
            <span id="conv-label">وحدة = </span>
            <input type="text" id="res-input" readonly placeholder="القيمة بالدولار" style="background: #161b22; color: #3fb950; font-weight: bold;">
        </div>
    </div>

    <!-- الشارت -->
    <div class="chart-box">
        <canvas id="mainChart" height="120"></canvas>
    </div>

    <script>
        let rawData = [];
        let currentSymbol = 'BTCUSDT';
        let currentFilter = 'all';
        let chartInstance = null;

        // دالة ذكية لتنسيق الأسعار مهما كانت صغيرة (مثل PEPE و BTTC و SHIB)
        function formatPrecisePrice(price) {
            if (price >= 1000) return '$' + price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            if (price >= 1) return '$' + price.toFixed(4);
            if (price >= 0.0001) return '$' + price.toFixed(6);
            if (price >= 0.000001) return '$' + price.toFixed(8);
            return '$' + price.toPrecision(4);
        }

        async function fetchMarket() {
            try {
                let res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                rawData = await res.json();
                renderUI();
            } catch (e) {
                console.error("خطأ في جلب البيانات:", e);
            }
        }

        function setCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = cat;
            renderUI();
        }

        function filterCoins() {
            renderUI();
        }

        function renderUI() {
            let query = document.getElementById('search-input').value.toUpperCase();
            let scroll = document.getElementById('coins-scroll');
            scroll.innerHTML = '';

            let list = rawData.filter(c => c.symbol.endsWith('USDT'));

            if (query) {
                list = list.filter(c => c.symbol.includes(query));
            } else if (currentFilter === 'memes') {
                const memes = ['PEPEUSDT', 'SHIBUSDT', 'BTTCUSDT', 'DOGEUSDT', 'FLOKIUSDT', 'BONKUSDT', 'WIFUSDT', 'BOMEUSDT'];
                list = list.filter(c => memes.includes(c.symbol));
            } else if (currentFilter === 'gainers') {
                list.sort((a, b) => parseFloat(b.priceChangePercent) - parseFloat(a.priceChangePercent));
                list = list.slice(0, 20);
            } else if (currentFilter === 'losers') {
                list.sort((a, b) => parseFloat(a.priceChangePercent) - parseFloat(b.priceChangePercent));
                list = list.slice(0, 20);
            } else {
                // العملات الرئيسية والقوية مرتبة حسب الحجم
                list.sort((a, b) => parseFloat(b.volume) - parseFloat(a.volume));
                list = list.slice(0, 40);
            }

            list.forEach(coin => {
                let sym = coin.symbol.replace('USDT', '');
                let price = parseFloat(coin.lastPrice);
                let chg = parseFloat(coin.priceChangePercent).toFixed(2);
                let isUp = chg >= 0;
                let isSelected = coin.symbol === currentSymbol;

                let card = document.createElement('div');
                card.className = `coin-card ${isSelected ? 'active' : ''}`;
                card.onclick = () => {
                    currentSymbol = coin.symbol;
                    renderUI();
                };

                card.innerHTML = `
                    <div class="c-sym">${sym}</div>
                    <div class="c-price">${formatPrecisePrice(price)}</div>
                    <div class="c-chg ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${chg}%</div>
                `;
                scroll.appendChild(card);
            });

            let selected = rawData.find(c => c.symbol === currentSymbol) || rawData[0];
            if (selected) updateDetails(selected);
        }

        function updateDetails(coin) {
            let sym = coin.symbol.replace('USDT', '');
            document.getElementById('p-title').innerText = `${sym} / USDT`;

            let price = parseFloat(coin.lastPrice);
            document.getElementById('m-price').innerText = formatPrecisePrice(price);

            let chg = parseFloat(coin.priceChangePercent).toFixed(2);
            let isUp = chg >= 0;
            let chgEl = document.getElementById('m-change');
            chgEl.innerText = (isUp ? '+' : '') + chg + '%';
            chgEl.className = 'm-val ' + (isUp ? 'up' : 'down');

            let high = parseFloat(coin.highPrice);
            let low = parseFloat(coin.lowPrice);
            document.getElementById('m-highlow').innerText = `${formatPrecisePrice(high)} \n ${formatPrecisePrice(low)}`;

            let volNum = (parseFloat(coin.quoteVolume) / 1000000).toFixed(2);
            document.getElementById('m-volume').innerText = `${volNum}M USDT`;

            document.getElementById('conv-label').innerText = `1 ${sym} =`;
            convertCurrency();
            drawChart(coin);
        }

        function convertCurrency() {
            let coin = rawData.find(c => c.symbol === currentSymbol);
            if (!coin) return;
            let price = parseFloat(coin.lastPrice);
            let qty = parseFloat(document.getElementById('qty-input').value) || 0;
            let total = qty * price;
            document.getElementById('res-input').value = total >= 1 ? '$' + total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4}) : '$' + total.toFixed(8);
        }

        function drawChart(coin) {
            let ctx = document.getElementById('mainChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            let base = parseFloat(coin.lastPrice);
            let chg = parseFloat(coin.priceChangePercent) / 100;
            let pastPrice = base / (1 + chg);

            // توليد نقاط واقعية مستندة لتغير السعر اليومي
            let p1 = pastPrice;
            let p2 = pastPrice + (base - pastPrice) * 0.3;
            let p3 = pastPrice + (base - pastPrice) * 0.6;
            let p4 = pastPrice + (base - pastPrice) * 0.85;

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['قبل 24س', 'الوقت السابق', 'منتصف الجلسة', 'قبل قليل', 'السعر الحالي'],
                    datasets: [{
                        label: 'السعر',
                        data: [p1, p2, p3, p4, base],
                        borderColor: '#58a6ff',
                        backgroundColor: 'rgba(88, 166, 255, 0.1)',
                        fill: true,
                        tension: 0.35,
                        borderWidth: 2,
                        pointRadius: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#8b949e', font: {size: 8} }, grid: { color: '#21262d' } },
                        y: { ticks: { color: '#8b949e', font: {size: 8} }, grid: { color: '#21262d' } }
                    }
                }
            });
        }

        fetchMarket();
        setInterval(fetchMarket, 10000);
    </script>
</body>
</html>
