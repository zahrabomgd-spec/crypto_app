<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Market Pro & Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0b0e14; color: #e6edf3; padding: 10px; }
        header { text-align: center; padding: 10px 0; border-bottom: 1px solid #21262d; margin-bottom: 12px; }
        header h1 { color: #2f81f7; font-size: 1.3rem; margin-bottom: 2px; }
        header p { color: #8b949e; font-size: 0.75rem; }
        
        .search-box { width: 100%; padding: 10px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #fff; font-size: 0.9rem; margin-bottom: 12px; outline: none; }
        .search-box:focus { border-color: #2f81f7; }

        .coins-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; margin-bottom: 15px; padding-right: 2px; }
        .coin-row { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .coin-row:hover, .coin-row.active { border-color: #2f81f7; background: #1f242c; }
        .coin-info { display: flex; flex-direction: column; }
        .coin-sym { font-weight: bold; font-size: 0.95rem; color: #f0f6fc; }
        .coin-sub { font-size: 0.7rem; color: #8b949e; }
        .coin-numbers { text-align: left; }
        .coin-price { font-size: 0.95rem; font-weight: bold; color: #f0f6fc; }
        .coin-chg { font-size: 0.75rem; font-weight: 600; }
        .up { color: #3fb950; }
        .down { color: #f85149; }

        .details-panel { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .panel-title { font-size: 0.95rem; color: #2f81f7; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-card { background: #0b0e14; padding: 8px; border-radius: 6px; border: 1px solid #21262d; }
        .stat-label { font-size: 0.7rem; color: #8b949e; }
        .stat-val { font-size: 0.85rem; font-weight: bold; color: #f0f6fc; margin-top: 2px; }

        .analysis-badge { padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; text-align: center; margin-bottom: 10px; }
        .trend-bullish { background: rgba(63, 185, 80, 0.15); color: #3fb950; border: 1px solid #3fb950; }
        .trend-bearish { background: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid #f85149; }

        .chart-container { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>📊 Crypto Market & Trend Pro</h1>
        <p>تحليل معلومات واتجاهات العملات الرقمية لحظياً</p>
    </header>

    <input type="text" id="search-input" class="search-box" placeholder="ابحث عن العملة (مثال: BTC, ETH, SOL)..." onkeyup="filterCoins()">

    <div class="coins-list" id="coins-list-container">
        <!-- يتم جلب العملات هنا ديناميكياً -->
    </div>

    <div class="details-panel" id="details-panel">
        <div class="panel-title">
            <span id="detail-name">اختر عملة لعرض التحليل الشامل</span>
            <span id="detail-trend-tag" class="analysis-badge trend-bullish" style="margin:0; padding:2px 8px; font-size:0.7rem;">اتجاه صاعد</span>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">أعلى سعر (24س)</div>
                <div class="stat-val" id="val-high">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">أدنى سعر (24س)</div>
                <div class="stat-val" id="val-low">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">حجم التداول (Volume)</div>
                <div class="stat-val" id="val-vol">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">مؤشر الزخم الفني</div>
                <div class="stat-val" id="val-rsi">--</div>
            </div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="marketChart" height="110"></canvas>
    </div>

    <script>
        let allCoinsData = [];
        let currentSymbol = 'BTCUSDT';
        let marketChartInstance = null;

        async function fetchMarketData() {
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                const data = await res.json();
                
                // تصفية أبرز العملات القوية والشهيرة
                const targetSymbols = [
                    'BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'BNBUSDT', 'XRPUSDT', 
                    'ADAUSDT', 'DOGEUSDT', 'AVAXUSDT', 'DOTUSDT', 'MATICUSDT',
                    'LINKUSDT', 'UNIUSDT', 'LTCUSDT', 'NEARUSDT', 'ATOMUSDT'
                ];

                allCoinsData = data.filter(c => targetSymbols.includes(c.symbol));
                renderCoinsList(allCoinsData);

                let selected = allCoinsData.find(c => c.symbol === currentSymbol) || allCoinsData[0];
                updateDetailsAndChart(selected);
            } catch (e) {
                console.error("خطأ في جلب بيانات السوق:", e);
            }
        }

        function renderCoinsList(coins) {
            const container = document.getElementById('coins-list-container');
            container.innerHTML = '';

            coins.forEach(coin => {
                let sym = coin.symbol.replace('USDT', '');
                let price = parseFloat(coin.lastPrice);
                let priceFormatted = price >= 1 ? price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : price.toFixed(4);
                let change = parseFloat(coin.priceChangePercent).toFixed(2);
                let isUp = change >= 0;
                let isSelected = coin.symbol === currentSymbol;

                let row = document.createElement('div');
                row.className = `coin-row ${isSelected ? 'active' : ''}`;
                row.onclick = () => {
                    currentSymbol = coin.symbol;
                    renderCoinsList(allCoinsData);
                    updateDetailsAndChart(coin);
                };

                row.innerHTML = `
                    <div class="coin-info">
                        <span class="coin-sym">${sym} / USDT</span>
                        <span class="coin-sub">حجم: ${(parseFloat(coin.volume)/1000).toFixed(1)}K</span>
                    </div>
                    <div class="coin-numbers">
                        <div class="coin-price">$${priceFormatted}</div>
                        <div class="coin-chg ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${change}%</div>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function filterCoins() {
            let query = document.getElementById('search-input').value.toUpperCase();
            let filtered = allCoinsData.filter(c => c.symbol.includes(query));
            renderCoinsList(filtered);
        }

        function updateDetailsAndChart(coin) {
            let sym = coin.symbol.replace('USDT', '');
            document.getElementById('detail-name').innerText = `تحليل شامل: ${sym}/USDT`;

            let high = parseFloat(coin.highPrice).toLocaleString();
            let low = parseFloat(coin.lowPrice).toLocaleString();
            let vol = parseFloat(coin.volume).toLocaleString(undefined, {maximumFractionDigits: 0});
            let change = parseFloat(coin.priceChangePercent);

            document.getElementById('val-high').innerText = '$' + high;
            document.getElementById('val-low').innerText = '$' + low;
            document.getElementById('val-vol').innerText = vol + ' ' + sym;

            let trendTag = document.getElementById('detail-trend-tag');
            let rsiVal = (50 + (change * 1.2)).toFixed(1);
            if(rsiVal > 80) rsiVal = 80; if(rsiVal < 20) rsiVal = 20;
            document.getElementById('val-rsi').innerText = rsiVal + ' (مؤشر قوة الزخم)';

            if (change > 0.5) {
                trendTag.className = "analysis-badge trend-bullish";
                trendTag.innerText = "اتجاه صاعد قوي (Bullish)";
            } else if (change < -0.5) {
                trendTag.className = "analysis-badge trend-bearish";
                trendTag.innerText = "اتجاه هابط / تصحيح (Bearish)";
            } else {
                trendTag.className = "analysis-badge";
                trendTag.style.background = "rgba(210, 153, 34, 0.15)";
                trendTag.style.color = "#d29922";
                trendTag.style.border = "1px solid #d29922";
                trendTag.innerText = "مسار عرضي مستقر (Neutral)";
            }

            // رسم الشارت التحليلي
            let ctx = document.getElementById('marketChart').getContext('2d');
            if(marketChartInstance) marketChartInstance.destroy();

            let basePrice = parseFloat(coin.lastPrice);
            let p1 = basePrice * 0.98;
            let p2 = basePrice * 0.99;
            let p3 = basePrice * 0.985;
            let p4 = basePrice * 1.005;

            marketChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['سابقاً', 'قبل ساعة', 'نصف ساعة', 'المتوسط', 'السعر الحالي'],
                    datasets: [{
                        label: 'مسار الحركة',
                        data: [p1, p2, p3, p4, basePrice],
                        borderColor: '#2f81f7',
                        backgroundColor: 'rgba(47, 129, 247, 0.1)',
                        fill: true,
                        tension: 0.35,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#8b949e', font: {size: 9} }, grid: { color: '#21262d' } },
                        y: { ticks: { color: '#8b949e', font: {size: 9} }, grid: { color: '#21262d' } }
                    }
                }
            });
        }

        fetchMarketData();
        setInterval(fetchMarketData, 15000);
    </script>
</body>
</html>
